<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thông tin - Bếp 11A</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #d9534f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; background: #d9534f; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #c9302c; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #0275d8; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        #loading { display: none; text-align: center; margin-top: 10px; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Đăng Ký Thông Tin</h2>
    <form id="registerForm">
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" name="name" required placeholder="Nhập họ và tên của bạn">
        </div>
        <div class="form-group">
            <label>Biệt danh (Nickname):</label>
            <input type="text" name="nickname" placeholder="Ví dụ: Tùng Kun">
        </div>
        <div class="form-group">
            <label>Lớp:</label>
            <input type="text" name="className" required placeholder="Ví dụ: 11A">
        </div>
        <div class="form-group">
            <label>Tiểu sử / Giới thiệu ngắn:</label>
            <textarea name="bio" placeholder="Vài dòng về bản thân..."></textarea>
        </div>
        <div class="form-group">
            <label>Link Ảnh đại diện (Avatar):</label>
            <input type="url" name="avatar" placeholder="Dán link ảnh vào đây">
        </div>
        <div class="form-group">
            <label>Link Facebook:</label>
            <input type="url" name="facebook" placeholder="https://facebook.com/...">
        </div>
        <div class="form-group">
            <label>Link Instagram:</label>
            <input type="url" name="instagram" placeholder="https://instagram.com/...">
        </div>
        <div class="form-group">
            <label>Link TikTok:</label>
            <input type="url" name="tiktok" placeholder="https://tiktok.com/@...">
        </div>
        
        <button type="submit" id="submitBtn">Gửi Thông Tin</button>
        <div id="loading">Đang gửi dữ liệu lên hệ thống, vui lòng chờ xíu...</div>
    </form>
    <a href="index.html" class="back-link">← Quay lại trang chủ</a>
</div>

<script>
    // 👇 DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO DƯỚI NÀY (Nhớ giữ nguyên dấu ngoặc kép)
    const SCRIPT_URL = "DÁN_LINK_WEB_APP_Ở_ĐÂY";

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (SCRIPT_URL.includes("DÁN_LINK_WEB_APP_Ở_ĐÂY")) {
            alert("Bạn chưa dán Link Google Apps Script vào code kìa!");
            return;
        }

        submitBtn.style.display = 'none';
        loading.style.display = 'block';

        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => (data[key] = value));

        // Dùng no-cors để né lỗi chặn duyệt trình duyệt của Google Script, sau đó tự động chuyển trang
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            alert("Đăng ký thành công!");
            window.location.href = "index.html"; // Tự động đá về trang chủ mượt mà
        })
        .catch(error => {
            console.error('Lỗi:', error);
            alert("Có lỗi xảy ra, thử lại nhé!");
            submitBtn.style.display = 'block';
            loading.style.display = 'none';
        });
    });
</script>

</body>
</html>
