<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thông tin - THPT Cẩm Giàng</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #d97706; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; background: #d97706; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #b45309; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #0275d8; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        #result { text-align: center; margin-top: 15px; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Đăng Ký Thành Viên</h2>
    
    <form id="form">
        <!-- Đã điền sẵn Access Key của bạn -->
        <input type="hidden" name="access_key" value="4ef25728-3090-4b94-97d2-37ef3e8eef8b">

        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" name="Họ và tên" required placeholder="Nhập họ và tên của bạn">
        </div>
        <div class="form-group">
            <label>Biệt danh (Nickname):</label>
            <input type="text" name="Biệt danh" placeholder="Ví dụ: Tùng Kun">
        </div>
        <div class="form-group">
            <label>Lớp:</label>
            <input type="text" name="Lớp" required placeholder="Ví dụ: 12A">
        </div>
        <div class="form-group">
            <label>Tiểu sử / Giới thiệu ngắn:</label>
            <textarea name="Tiểu sử" placeholder="Vài dòng về bản thân..."></textarea>
        </div>
        <div class="form-group">
            <label>Link Ảnh đại diện (Avatar):</label>
            <input type="url" name="Link Ảnh" placeholder="Dán link ảnh vào đây">
        </div>
        <div class="form-group">
            <label>Link Facebook:</label>
            <input type="url" name="Link Facebook" placeholder="https://facebook.com/...">
        </div>
        <div class="form-group">
            <label>Link Instagram:</label>
            <input type="url" name="Link Instagram" placeholder="https://instagram.com/...">
        </div>
        <div class="form-group">
            <label>Link TikTok:</label>
            <input type="url" name="Link TikTok" placeholder="https://tiktok.com/@...">
        </div>
        
        <button type="submit" id="submitBtn">Gửi Thông Tin Ngay</button>
        <div id="result"></div>
    </form>
    
    <a href="search.html" class="back-link">← Quay lại trang tìm kiếm</a>
</div>

<script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(form);
        const object = Object.fromEntries(formData);
        const json = JSON.stringify(object);

        result.innerHTML = "Đang gửi thông tin...";
        result.style.color = "#d97706";

        fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let jsonResponse = await response.json();
                if (response.status == 200) {
                    result.innerHTML = "🎉 Gửi thành công! Đang quay lại trang tìm kiếm...";
                    result.style.color = "green";
                    form.reset();
                    
                    // Sau 2 giây tự động quay về trang tìm kiếm
                    setTimeout(() => {
                        window.location.href = "search.html"; 
                    }, 2000);
                } else {
                    result.innerHTML = jsonResponse.message;
                    result.style.color = "red";
                }
            })
            .catch(error => {
                result.innerHTML = "Có lỗi xảy ra, vui lòng thử lại!";
                result.style.color = "red";
            });
    });
</script>

</body>
</html>
