<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thông tin - THPT Cẩm Giàng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 30px 20px; display: flex; justify-content: center; align-items: center; }
        
        .container { max-width: 500px; width: 100%; background: var(--card-bg); padding: 35px 30px; border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 1.8rem; color: var(--text-main); font-weight: 700; margin-bottom: 8px; }
        header h1 span { color: var(--primary); }
        header p { color: var(--text-sub); font-size: 0.9rem; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
        .form-group input[type="text"], 
        .form-group input[type="url"], 
        .form-group textarea {
            width: 100%; padding: 12px 16px; font-size: 0.95rem; background: #f8fafc; border: 1px solid var(--border);
            color: var(--text-main); border-radius: 12px; outline: none; transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); }
        .form-group textarea { resize: vertical; min-height: 90px; }
        
        /* Tùy chỉnh ô chọn file ảnh */
        .form-group input[type="file"] {
            width: 100%; padding: 10px; background: #f8fafc; border: 1px dashed var(--border);
            border-radius: 12px; font-size: 0.9rem; color: var(--text-sub); cursor: pointer;
        }

        .btn-submit {
            width: 100%; background: var(--primary); color: white; padding: 14px; border-radius: 12px;
            border: none; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
            transition: background 0.2s, transform 0.2s; margin-top: 10px;
        }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }

        #result { text-align: center; margin-top: 15px; font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Đăng ký thông tin <span>THPT Cẩm Giàng</span></h1>
            <p>Điền thông tin và gửi ảnh đại diện của bạn ✨</p>
        </header>

        <form action="https://api.web3forms.com/submit" method="POST" id="form" enctype="multipart/form-data">
            <!-- Thay đoạn mã bên dưới bằng Access Key của bạn từ web3forms.com -->
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

            <div class="form-group">
                <label>Họ và tên của bạn (*)</label>
                <input type="text" name="name" required placeholder="Ví dụ: Nguyễn Văn A">
            </div>

            <div class="form-group">
                <label>Tải ảnh Avatar của bạn</label>
                <input type="file" name="avatar" accept="image/*">
            </div>

            <div class="form-group">
                <label>Biệt danh / Tên gọi ở nhà</label>
                <input type="text" name="nickname" placeholder="Ví dụ: A mập">
            </div>

            <div class="form-group">
                <label>Lớp (*)</label>
                <input type="text" name="class" required placeholder="Ví dụ: 12A">
            </div>

            <div class="form-group">
                <label>Giới thiệu ngắn (Bio)</label>
                <textarea name="bio" placeholder="Vài dòng giới thiệu bản thân..."></textarea>
            </div>

            <div class="form-group">
                <label>Link Facebook cá nhân</label>
                <input type="url" name="facebook" placeholder="https://facebook.com/...">
            </div>

            <div class="form-group">
                <label>Link Instagram / Locket</label>
                <input type="url" name="instagram" placeholder="https://instagram.com/...">
            </div>

            <div class="form-group">
                <label>Link TikTok</label>
                <input type="url" name="tiktok" placeholder="https://tiktok.com/@...">
            </div>

            <button type="submit" class="btn-submit">Gửi thông tin</button>
            <div id="result"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const result = document.getElementById('result');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            result.innerHTML = "Đang gửi thông tin và tải ảnh lên...";
            result.style.color = "var(--text-sub)";

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(async (response) => {
                let jsonResponse = await response.json();
                if (response.status == 200) {
                    result.innerHTML = "Gửi thông tin thành công! Cảm ơn bạn 🎉";
                    result.style.color = "#16a34a";
                    form.reset();
                } else {
                    result.innerHTML = jsonResponse.message;
                    result.style.color = "#dc2626";
                }
            })
            .catch(error => {
                result.innerHTML = "Có lỗi xảy ra, vui lòng thử lại!";
                result.style.color = "#dc2626";
            });
        });
    </script>
</body>
</html>
