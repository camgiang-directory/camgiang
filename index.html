<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THPT Cẩm Giàng Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f59e0b; /* Màu vàng Gold sang trọng */
            --primary-hover: #d97706;
            --bg-color: #090a0f;
            --card-bg: #12141c;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --border: #1f293d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 35px; }
        header h1 { font-size: 2.2rem; color: var(--text-main); margin-bottom: 10px; font-weight: 700; letter-spacing: -0.5px; }
        header h1 span { color: var(--primary); }
        header p { color: var(--text-sub); font-size: 1rem; }
        
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }
        .search-box input {
            width: 100%;
            max-width: 480px;
            padding: 14px 22px;
            font-size: 0.95rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 14px;
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
        }
        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 14px;
            border: 2px solid var(--primary);
        }
        .name { font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
        .nickname { font-size: 0.85rem; color: var(--primary); font-weight: 500; margin-bottom: 8px; }
        .class-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .bio { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 16px; min-height: 35px; line-height: 1.4; }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .social-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            background: #1a1e29;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .social-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

        /* Hộp thoại Popup Mini Blog cá nhân */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 6, 10, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.4rem;
            color: var(--text-sub);
            cursor: pointer;
            background: none; border: none;
        }
        .close-btn:hover { color: var(--text-main); }
        .modal-avatar {
            width: 100px; height: 100px;
            border-radius: 50%; object-fit: cover;
            border: 3px solid var(--primary);
            margin-bottom: 15px;
        }
        .modal-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
        .modal-nickname { color: var(--primary); font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
        .modal-bio { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; margin: 15px 0; font-size: 0.9rem; color: var(--text-sub); border: 1px solid var(--border); line-height: 1.4; }
        
        .full-socials {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            background: #1a1e29;
            border: 1px solid var(--border);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .link-item:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(245, 158, 11, 0.05);
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-sub);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>THPT Cẩm Giàng <span>Directory</span></h1>
            <p>Không gian kết nối, tìm kiếm thông tin bạn bè toàn trường ✨</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên, biệt danh hoặc lớp...">
        </div>

        <div class="grid" id="profileGrid">
            <!-- Khu vực danh sách trống, sạch sẽ không có thành viên mẫu -->
            <div class="empty-state">
                <i class="fa-solid fa-users-rectangle" style="font-size: 2.5rem; margin-bottom: 12px; color: var(--primary);"></i>
                <p>Chưa có thành viên nào. Hãy điền form để hiển thị thông tin lên đây nhé!</p>
            </div>
        </div>
    </div>

    <!-- Hộp thoại Chi tiết Profile (Mini Blog) -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeProfile()">&times;</button>
            <img src="" id="mAvatar" class="modal-avatar" alt="Avatar">
            <div class="modal-nickname" id="mNickname"></div>
            <div class="modal-name" id="mName"></div>
            <div class="class-badge" id="mClass"></div>
            <div class="modal-bio" id="mBio"></div>
            
            <div class="full-socials">
                <a href="#" id="mLinkFb" target="_blank" class="link-item"><i class="fab fa-facebook-f" style="color: #1877f2;"></i> Nhắn tin Facebook</a>
                <a href="#" id="mLinkIg" target="_blank" class="link-item"><i class="fab fa-instagram" style="color: #e4405f;"></i> Xem Instagram / Locket</a>
                <a href="#" id="mLinkTt" target="_blank" class="link-item"><i class="fab fa-tiktok" style="color: #fff;"></i> Ghé thăm TikTok</a>
            </div>
        </div>
    </div>

    <script>
        function openProfile(name, nickname, className, bio, avatar, fb, ig, tt) {
            document.getElementById('mName').innerText = name;
            document.getElementById('mNickname').innerText = nickname ? `"${nickname}"` : '';
            document.getElementById('mClass').innerText = className;
            document.getElementById('mBio').innerText = bio;
            document.getElementById('mAvatar').src = avatar || 'https://via.placeholder.com/150';
            
            document.getElementById('mLinkFb').href = fb || '#';
            document.getElementById('mLinkIg').href = ig || '#';
            document.getElementById('mLinkTt').href = tt || '#';

            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfile() {
            document.getElementById('profileModal').style.display = 'none';
        }

        window.onclick = function(event) {
            let modal = document.getElementById('profileModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                if(text.includes(keyword)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
